[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medtrace-ai"
version = "0.1.0"
description = "Synthetic healthcare data ingestion and validation prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
semantic = [
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
